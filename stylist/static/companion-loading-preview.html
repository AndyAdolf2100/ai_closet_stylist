<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>衣间 · 通用加载图标</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/companion-characters.css"><link rel="stylesheet" href="/static/companion-loading.css?v=selected-loading-v4"><style>
body{display:block;min-height:100dvh;padding:48px 24px;background:var(--bg)}main{width:min(920px,100%);margin:auto;padding:0;max-width:none}h1{max-width:none;margin:12px 0;font:28px/1.5 Georgia,"Songti SC",serif}.intro{color:var(--muted);font-size:13px;line-height:1.9}.preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}.preview-card{padding:27px;border:1px solid var(--line);border-radius:24px;background:var(--paper);min-width:0}.preview-card h2{font:20px Georgia,"Songti SC",serif;margin:0 0 20px}.preview-card>p{font-size:12px;line-height:1.8;color:var(--muted)}.sizes{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:22px 0 6px}.preview-card .companion-wait{margin-top:20px}.controls{display:flex;gap:12px;margin-top:24px}button{min-height:44px;border-radius:24px;font-size:12px}.paused .companion-loading *{animation-play-state:paused!important}.preview-card[data-theme=male]{--accent:#3c5b79;--soft:#eaf0f5;--paper:#fbfdff;--line:#dce5ec;--ink:#33485b;--muted:#7d8d9a}@media(max-width:760px){body{padding:25px 16px}.preview-grid{grid-template-columns:1fr;gap:16px}.preview-card{padding:20px}h1{font-size:24px}.sizes{justify-content:flex-start;gap:27px}}
</style></head><body><main><span class="eyebrow">衣间 · 加载中的小陪伴</span><h1>等一会儿，也有回应。</h1><p class="intro">六位已选助理各自的眨眼形象，三种尺寸。眨眼与细环持续循环；开启系统「减少动态效果」时静止。此页只预览动画，不连接业务服务。</p><div class="preview-grid" id="examples"></div><div class="controls"><button id="pause" aria-pressed="false">暂停动画</button></div></main><script src="/static/companion-characters.js"></script><script src="/static/companion-loading.js?v=selected-loading-v4"></script><script>
for(const {id:persona,gender,label} of CompanionCharacters.all){
 const card=document.createElement('section');card.className='preview-card';card.dataset.theme=gender;
 const title=document.createElement('h2');title.textContent=label;
 const sizes=document.createElement('div');sizes.className='sizes';
 for(const size of ['small','medium','large'])sizes.append(CompanionLoading.icon({persona,size,label:(gender==='male'?'男':'女')+'版加载图标，'+size}));
 const row=CompanionLoading.create({persona,message:'正在整理这次的搭配想法…',detail:'按你这次提到的要求，慢慢选。'});row.classList.add('companion-wait');
 card.append(title,sizes,row);document.querySelector('#examples').append(card);
}
document.querySelector('#pause').onclick=event=>{const paused=document.body.classList.toggle('paused');event.currentTarget.textContent=paused?'继续动画':'暂停动画';event.currentTarget.setAttribute('aria-pressed',String(paused));};
</script></body></html>
