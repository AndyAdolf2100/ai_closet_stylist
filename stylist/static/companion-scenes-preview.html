<!doctype html><html lang="zh-CN" data-companion-persona="female_warm_v1"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六位助理 · 守候与眨眼</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/companion-characters.css"><style>body{display:block;padding:28px;max-width:1200px;margin:auto;background:var(--paper,#fffaf4)}h1{max-width:none;font-size:28px}main{margin:0;width:100%;max-width:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{border:1px solid var(--line,#ddd);border-radius:20px;padding:18px;min-width:0}article .mascot.hero-mascot{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:1}article p{font-size:13px}article footer{display:flex;align-items:center;gap:12px}button{margin-bottom:20px}@media(max-width:760px){body{padding:16px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article{padding:10px}article footer{gap:6px;flex-wrap:wrap}article h2{font-size:16px}}</style><h1>六位助理 · 守候与眨眼</h1><p>首页精灵图／对话静态头像／天气静态头像</p><button id="theme">切换背景主题</button><main id="cards"></main><script src="/static/companion-characters.js"></script><script>
const scenes=['花店窗边','阳光阅读角','城市露台','海边画室','雨夜书房','暮色天台'];
for(const [i,c] of CompanionCharacters.all.entries()){const card=document.createElement('article');const base='/static/assets/characters/companion-scenes-v1/'+c.id;for(const k of ['hero','avatar','weather'])card.style.setProperty('--companion-'+k+'-image','url("'+(k==='hero'?'/static/assets/characters/companion-scenes-v2/'+c.id+'-hero.png':base+'-'+k+'.png')+'")');['x1','y1','x2','y2','rx','ry'].forEach((key,j)=>card.style.setProperty('--blink-eye-'+key,c.blinkEyes[j]+'%'));card.innerHTML='<div class="mascot hero-mascot" role="img" aria-label="'+c.label+'眨眼精灵图"></div><h2>'+c.label+'</h2><p>'+scenes[i]+'</p><footer><span class="mascot companion-sprite avatar-mini" role="img" aria-label="对话头像"></span><span class="mascot companion-sprite weather-mascot" role="img" aria-label="天气头像"></span></footer>';document.querySelector('main').append(card)}
document.querySelector('#theme').onclick=()=>{const r=document.documentElement;r.dataset.stylistGender=r.dataset.stylistGender==='male'?'female':'male'};
</script></html>
