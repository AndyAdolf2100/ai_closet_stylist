<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衣间 · 搭配组合设计</title><link rel="stylesheet" href="/static/style.css?v=preview-gallery-v32"><link rel="stylesheet" href="/static/outfit-board.css?v=4"><style>
body{display:block;padding:32px 20px;max-width:840px;margin:auto}h1{max-width:none;font-size:30px;margin:14px 0}body>p{font-size:13px;color:var(--muted);line-height:1.8}.demo-toolbar{display:flex;gap:10px;margin:22px 0}.demo-toolbar button{min-height:44px}.demo-toolbar [aria-pressed=true]{background:var(--soft);border-color:var(--accent)}.demo-look{max-width:540px;margin:auto}.demo-look h3{margin-bottom:18px}#design-notice{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.8}
</style></head><body><div class="eyebrow">YI JIAN · OUTFIT STUDY</div><h1>喜欢的衣服，放在一起。</h1><p>搭配组合与单品详情 · 可点击设计预览</p><div class="demo-toolbar"><button id="female" aria-pressed="true">暖色主题</button><button id="male" aria-pressed="false">雾蓝主题</button></div><article class="look demo-look"><h3>轻松一点的通勤日</h3><div id="sample"></div><h4>照着这样穿</h4><ul><li>衬衫穿在里面，风衣轻轻敞开。</li><li>深色长裤收住整体，浅色鞋履留一点轻快。</li></ul></article><p id="design-notice">示意单品用于展示排版与交互，不是用户衣橱或实际选款结果。真实搭配将使用所选衣物的抠图与原图。</p><script src="/static/product-preview.js?v=4"></script><script src="/static/cutout-core.js?v=2"></script><script src="/static/local-cutout.js?v=3"></script><script src="/static/outfit-images.js?v=1"></script><script src="/static/outfit-board.js?v=5"></script><script>
LocalCutout.setOwner('public-design-sample');
LocalCutout.setSourceLoader((item,signal,kind)=>new Promise((resolve,reject)=>{
const image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;c.getContext('2d').drawImage(image,0,0);c.toBlob(resolve,'image/png')};image.onerror=reject;image.src=item.cutout_image||item.original_image;
}));
const data=[['top','shirt','奶油白衬衫','白色','棉'],['bottom','trousers','深灰直筒裤','深灰色',''],['outer','coat','浅驼色风衣','驼色',''],['shoes','shoes','米白休闲鞋','米白色',''],['accessory','bag','棕色手提包','棕色','']].map(([slot,file,title,color,material],i)=>({slot,title,color,material,source:'user',product_id:String(i+1),class_name:({top:'上装',bottom:'长裤',outer:'风衣',shoes:'休闲鞋',accessory:'手提包'})[slot],cutout_image:'/static/assets/outfit-demo/'+file+'.svg',original_image:'/static/assets/outfit-demo/'+file+'.svg'}));
document.getElementById('sample').append(OutfitBoard.create({title:'轻松一点的通勤日',items:data}));
for(const gender of ['female','male'])document.getElementById(gender).onclick=()=>{document.documentElement.dataset.stylistGender=gender;for(const g of ['female','male'])document.getElementById(g).setAttribute('aria-pressed',String(g===gender))};
</script></body></html>
