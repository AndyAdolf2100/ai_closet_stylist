<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气视觉预览 · 非实时预警</title><link rel="stylesheet" href="/static/style.css?v=weather-negative-temp-20261027"><style>body{display:block;padding:24px;max-width:1100px;margin:auto}h1{max-width:none;font-size:28px}.preview-note{padding:14px;background:#fff0d6;border:1px solid #d8bb74;border-radius:12px;line-height:1.8;font-size:13px}.preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.preview-grid .forecast-card{min-height:210px;margin:0}.preview-grid p{font-size:12px;line-height:1.8;color:#6f6c61}.preview-grid .official-warning{height:100%;margin:0}h2{font:23px Georgia,"Songti SC",serif;margin-top:35px}.photo-note{font-size:10px;color:#8b8176}a{color:var(--accent)}</style></head><body>
<a href="/mobile/">← 返回衣间</a><h1>衣衣的天气小画册</h1><p class="preview-note">样式演示：下方天气及预警均为示例，不是当前城市的真实预报或官方发布。角色和自然背景为AI生成装饰图片，不能作为气象判断依据。</p><h2>自然天气背景</h2><div id="weather-demos" class="preview-grid"></div><h2>置顶预警样式</h2><div id="warning-demos" class="preview-grid"></div><h2>每种天气，衣衣都认真照顾</h2><div id="hazard-demos" class="preview-grid"></div>
<script src="/static/weather-visuals.js?v=weather-eight-20261027"></script><script>
const box=document.getElementById('weather-demos');
for(const [name,description] of [['晴天','温柔日光与草地'],['阴天','柔和云层与远山'],['小雨','花叶间的雨滴'],['雷阵雨','灰蓝云层与远处闪电'],['暴雨','密集雨线与水面溅雨'],['雪天','积雪枝头与原野'],['大雾','薄雾森林'],['大风','随风摇曳的草地']]){const card=document.createElement('article');card.className='forecast-card compact';WeatherVisuals.background(card,[{condition_day:name}]);const h=document.createElement('h3');h.textContent=name;const p=document.createElement('p');p.textContent=description+' · 背景风格演示';const note=document.createElement('p');note.className='photo-note';note.textContent='AI氛围背景 · 非当地实景';card.append(h,p,note);box.append(card);}
const sample=(level,event,hazard)=>({id:'demo-'+hazard,level,event,hazard,title:event+WeatherVisuals.levels[level]+'预警（演示）',area:'示例地区 · 非真实预警',sender:'示例发布机构（演示）',issued_at:new Date().toISOString(),text:'这里展示接入官方预警后显示的原始灾害信息及防护内容。本卡不代表任何地区当前存在预警。',source_url:''});
for(const [level,event,hazard] of [['red','暴雨','rain'],['orange','台风','typhoon'],['yellow','大雾','fog'],['blue','寒潮','cold']])document.getElementById('warning-demos').append(WeatherVisuals.warningCard(sample(level,event,hazard),true));
const names=['暴雨','暴雪','大雾','大风','雷电','高温','寒潮','沙尘暴','道路结冰','冰雹','干旱','森林火险','台风','龙卷风','洪水','其他气象灾害'];
WeatherVisuals.hazards.forEach((hazard,i)=>document.getElementById('hazard-demos').append(WeatherVisuals.warningCard(sample('yellow',names[i],hazard),true)));
</script></body></html>
