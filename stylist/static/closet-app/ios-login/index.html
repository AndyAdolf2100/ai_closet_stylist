<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>当前 iOS 登录页 · HTML 对照</title><style>*{box-sizing:border-box}body{margin:0;background:#eceef3;color:#171a1d;font:14px -apple-system,'PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #9074b5;outline-offset:3px}[hidden]{display:none!important}.tools{max-width:850px;margin:20px auto;padding:0 20px;line-height:1.9}.tools p{font-size:12px;color:#737887}.tools a{color:#695687}.phone{width:min(393px,100%);min-height:852px;margin:20px auto;background:white;position:relative;overflow:hidden}.status{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 27px;font-size:16px;font-weight:600}.island{position:absolute;top:13px;left:calc(50% - 52px);height:30px;width:104px;border-radius:25px;background:#000}.status small{font-size:12px}.nav{height:44px;padding:0 17px}.nav button{font-size:28px}.content{padding:16px 24px 35px}h1{text-align:center;font-size:20px;font-weight:500;line-height:22px;margin:0}.mobile{display:block;width:100%;height:50px;border:0;background:#f6f6f6;border-radius:5px;padding:0 24px;font-size:16px;color:#252627;margin:56px 0 32px}.mobile::placeholder{color:#c1c2c4}.login{display:block;margin:0 9px;width:calc(100% - 18px);height:50px;border-radius:25px;background:#fad6ef url('https://aicloset-test-oss.wxbjq.net.cn/aicloset-server/6/1256/c5275f97e81a44c6b9559d848e7ea68f.png') center/100% 100%;color:#695687;font-size:16px;font-weight:500}.agree{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:32px;min-height:40px;color:#a4a5a8;font-size:12px;line-height:1.8}.agree input{appearance:none;width:16px;height:16px;border-radius:50%;background:#e2e3e5;margin:0;flex-shrink:0}.agree input:checked{background:#9074b5;box-shadow:inset 0 0 0 4px #e2e3e5}.agree button{color:#ff4fca;font-size:12px;padding:0 2px}.vendors{text-align:center;margin-top:60px}.vendors p{font-size:14px;margin:0 0 16px}.vendor-row{display:flex;justify-content:center;gap:24px}.vendor-row button{padding:0;width:40px;height:40px;min-height:40px}.vendor-row img{width:40px;height:40px;object-fit:contain}.feedback{font-size:12px;color:#9074b5;line-height:1.8;text-align:center;margin-top:22px}.feedback:empty{display:none}.desc{text-align:center;color:#a4a5a8;font-size:14px;line-height:1.8;margin:22px 0}.code{display:block;letter-spacing:14px;width:100%;height:60px;border:0;border-bottom:1px solid #dedee2;background:white;text-align:center;font-size:26px;margin-top:30px;padding:0 10px}.retry{display:block;margin:20px auto;color:#a4a5a8;font-size:14px}.code-note{font-size:12px;color:#a4a5a8;text-align:center}.done{display:block;margin:30px auto;color:#695687}@media(max-width:500px){body{background:#fff}.tools{margin:12px auto}.phone{margin:0 auto}.status{padding-top:env(safe-area-inset-top)}}@media(max-width:350px){.agree{gap:7px;font-size:12px}.agree button{font-size:12px}.content{padding-inline:20px}}</style><body><section class="tools"><strong>当前 iOS 登录界面 · 源码对照</strong><p>保留当前白底、粉紫渐变按钮和入口排列。示例交互，不发送短信、不执行授权、不登录账号。状态栏为视觉示意。</p><label><input type="checkbox" id="installed">模拟已安装微信</label> · <button id="sample">填入示例手机号</button> · <a href="../login/index.html">查看爱搭衣橱新版设计</a></section><main class="phone"><div class="status"><span>9:41</span><span class="island" aria-hidden="true"></span><small>▂▄▆　◒　▰</small></div><nav class="nav"><button id="back" hidden aria-label="返回">‹</button></nav><section class="content"><section id="mobile-page"><h1>手机号登录/注册</h1><input class="mobile" id="mobile" aria-label="手机号" placeholder="请输入手机号" type="tel" autocomplete="tel-national" maxlength="11"><button id="login" class="login">登录</button><div class="agree"><input type="checkbox" id="agree" aria-label="同意用户协议和隐私政策"><span>登录即代表同意 <button data-policy="用户协议">用户协议</button> 和 <button data-policy="隐私政策">隐私政策</button></span></div><section class="vendors"><p>其他登录方式</p><div class="vendor-row"><button id="wechat" data-provider="微信" hidden aria-label="微信登录"><img src="https://aicloset-test-oss.wxbjq.net.cn/aicloset-server/6/1256/43f77fcca70d4db096ebca72159d47d4.png" alt=""></button><button data-provider="Apple" aria-label="Apple登录"><img src="https://aicloset-test-oss.wxbjq.net.cn/aicloset-server/6/1256/bdf3694353924e24b4e368de3bb8d83f.png" alt=""></button></div></section></section><section id="code-page" hidden><h1>请输入验证码</h1><p class="desc" id="destination"></p><input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="验证码"><button id="retry" class="retry">重新发送</button><p class="code-note">验证码步骤预览 · 未发送短信</p><button id="done" class="done">预览后续 onboarding</button></section><p class="feedback" id="feedback" role="status"></p></section></main><script>const $=s=>document.querySelector(s);const note=t=>$('#feedback').textContent=t;$('#installed').onchange=e=>$('#wechat').hidden=!e.target.checked;$('#sample').onclick=()=>{$('#mobile').value='13800000000';};$('#login').onclick=()=>{if(!/^1[3-9][0-9]{9}$/.test($('#mobile').value)){note('请输入正确的手机号');return}if(!$('#agree').checked){note('请先阅读并同意用户协议与隐私政策');return}$('#mobile-page').hidden=true;$('#code-page').hidden=false;$('#back').hidden=false;$('#destination').textContent='手机号 '+$('#mobile').value;note('');};$('#back').onclick=()=>{$('#mobile-page').hidden=false;$('#code-page').hidden=true;$('#back').hidden=true;note('');};$('#retry').onclick=()=>note('此HTML不发送短信，也不模拟发送成功。');document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>note($('#agree').checked?b.dataset.provider+'授权入口预览，未发起真实授权。':'请先阅读并同意用户协议与隐私政策'));document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>note(b.dataset.policy+'入口预览；正式条款沿用App文档，本页不提供替代条款。'));$('#done').onclick=()=>location.href='../ios-onboarding/index.html';</script></body></html>
