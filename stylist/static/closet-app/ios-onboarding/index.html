const pages=['性别','称呼','年龄','城市','偏好'];let step=0;const draft={gender:'',name:'',age:'',city:''};const $=s=>document.querySelector(s);const el=(tag,cls,text)=>{const n=document.createElement(tag);n.className=cls;if(text)n.textContent=text;return n};
function image(key,cls){const i=el('img',cls);i.src=assets[key];i.alt='';return i}
function notice(text){$('#message').textContent=text}
function choice(text,key){const b=el('button','glass row',text);b.setAttribute('aria-pressed',String(draft[key]===text));b.append(el('span','radio'));b.onclick=()=>{draft[key]=text;render()};return b}
function render(){const c=$('#content');c.className='content'+(step===1?' name':'');c.replaceChildren();$('#tabs').replaceChildren(...pages.map((name,i)=>{const b=el('button','',name);b.setAttribute('aria-current',String(step===i));b.onclick=()=>{step=i;render()};return b}));$('#back').hidden=step===0;$('#skip').hidden=![2,3].includes(step);$('.footer').hidden=step===4;$('#next').disabled=!draft[['gender','name','age','city'][step]];$('#next').style.backgroundImage=`url(${assets.activity_evaluation_button})`;
if(step===0){c.append(el('h1','','你的性别是?'),el('p','subtitle','用于后续推荐的单品和搭配是男装还是女装'));const box=el('div','gender');[['男性','小哥哥','先看男装','male'],['女性','小姐姐','先看女装','female']].forEach(([value,title,sub,id])=>{const b=el('button','glass');b.append(image('onboarding_gender_'+id,''),el('span','',title),el('small','',sub),el('span','radio'));b.setAttribute('aria-pressed',String(draft.gender===value));b.onclick=()=>{draft.gender=value;render()};box.append(b)});c.append(box)}
if(step===1){c.append(image('onboarding_welcome_orb','orb'),el('p','welcome','你好，欢迎使用爱搭衣橱！我是你的搭配助手\n让我先认识你一下，好吗'),el('h1','','希望我怎么称呼你?'),el('p','subtitle','选择一个称呼，之后可以随时修改哦～'));const rows=el('div','rows');['小鹿','阿橙','团子'].forEach(x=>rows.append(choice(x,'name')));const wx=el('button','glass row','使用微信昵称　去授权 ›');wx.onclick=()=>notice('HTML 预览不调用微信授权。请使用示例昵称或自定义称呼。');const custom=el('button','glass row',draft.name&&!['小鹿','阿橙','团子'].includes(draft.name)?draft.name:'自定义称呼　✎');custom.onclick=()=>{$('#editor').hidden=false;$('#custom-name').focus()};rows.append(wx,custom);c.append(rows);const editor=el('div','editor');editor.id='editor';editor.hidden=true;const input=el('input','');input.id='custom-name';input.placeholder='输入你的称呼';input.maxLength=24;input.value=draft.name;const save=el('button','','使用这个称呼');save.onclick=()=>{if(input.value.trim()){draft.name=input.value.trim();render()}};editor.append(input,save);c.append(editor)}
if(step===2){c.append(el('h1','','你的年龄范围是?'),el('p','subtitle','我会用于你的风格偏好。'));const rows=el('div','rows');['18岁以下','18–24岁','25–34岁','35岁及以上'].forEach(x=>rows.append(choice(x,'age')));c.append(rows)}
if(step===3){c.append(el('h1','','你常住在哪座城市?'),el('p','subtitle','选填，随时可以补充或修改。'),el('p','subtitle','搜索或填写城市'));const input=el('input','glass city-input');input.placeholder='搜索城市';input.setAttribute('aria-label','搜索城市');const list=el('div','glass city-list');function cities(){list.replaceChildren(...['北京','上海','广州','深圳'].filter(x=>x.includes(input.value.trim())).map(x=>choice(x,'city')));if(!list.children.length)list.append(el('p','message','示例列表未包含该城市'))}input.oninput=cities;cities();const loc=el('button','location','⌖ 使用定位');loc.onclick=()=>notice('HTML 预览不请求定位权限。');c.append(input,list,loc)}
if(step===4){c.append(el('h1','','平时怎么穿？'),el('p','subtitle','选简单聊聊日常风格，让我为你打理衣橱、推荐搭配。'),el('p','section-label','了解偏好'));const list=el('div','glass');[['upload','上传灵感图','发一张你喜欢的穿搭图，小红书截图或日常收藏都可以。'],['explore','探索我的偏好','点点泡泡，发现喜欢和不喜欢的穿搭。'],['chat','直接聊聊','说说你的喜好，或平时穿衣遇到的困扰。']].forEach(([id,title,desc])=>{const b=el('button','pref'),text=el('span','');text.append(el('strong','',title),el('small','',desc));b.append(image('onboarding_preference_'+id,''),text,el('span','','›'));b.onclick=()=>notice('当前 iOS 路由会进入爱搭衣橱 Agent。本 HTML 仅展示入口，不执行上传、偏好探索或模型请求。');list.append(b)});c.append(list)}
