<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>衣衣 · 窗台眨眼预览</title>
  <link rel="stylesheet" href="/static/style.css?v=yiyi-window-blink-20261027">
  <style>
    body{display:block;max-width:860px;margin:auto;padding:32px 24px}
    h1{max-width:none;font-size:28px}
    p{font-size:14px;line-height:1.8;color:var(--muted)}
    .examples{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:40px;padding:32px 0}
    .example{text-align:center}
    .examples .hero-mascot{position:relative;right:auto;top:auto;transform:none;margin:12px auto;width:180px;height:180px}
    .examples .small{width:106px;height:106px}
    .sheet{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:16px}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <a href="/mobile/">← 返回衣间</a>
  <h1>衣衣趴在窗台上眨眼</h1>
  <p>身体和窗台固定，眼睛六帧开合，每 4.8 秒循环一次，先静静停留再眨眼。系统开启“减少动态效果”时显示静态首帧。</p>
  <div class="examples">
    <div class="example"><div class="mascot hero-mascot" data-mood="greeting" role="img" aria-label="衣衣趴在窗台上眨眼的循环动画"></div><p>桌面尺寸</p></div>
    <div class="example"><div class="mascot hero-mascot small" data-mood="greeting" role="img" aria-label="衣衣趴在窗台上眨眼的循环动画"></div><p>手机尺寸</p></div>
  </div>
  <p>原始精灵图：3 列 × 2 行，按从左到右、从上到下播放。</p>
  <img class="sheet" src="/static/assets/yiyi-window-blink-v1.png" alt="衣衣趴在窗台上眨眼六帧精灵图" width="1536" height="1024">
</body>
</html>
