<!doctype html>
<html lang="zh-CN" data-app-design="yijian" data-app-palette="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话排查 · 爱搭衣橱运维</title><link rel="stylesheet" href="/static/closet-app/palette.css"><link rel="stylesheet" href="/static/closet-app/agent-scoped.css"><link rel="stylesheet" href="/static/closet-app/agent-yijian.css"><link rel="stylesheet" href="/static/outfit-board.css"><link rel="stylesheet" href="/static/ops/console.css?v=mobile-messages-v2"></head>
<body><header class="ops-top"><div class="ops-brand"><span class="ops-mark">✧</span><div><strong>爱搭衣橱 <span>运维工作台</span></strong><p>CONVERSATION INSPECTOR</p></div></div><span class="readonly">只读查看</span></header>
<main class="ops-shell"><section class="query-panel"><div><h1>会话与消息排查</h1><p>按手机号或用户 ID 查找历史，定位每一轮消息的问题。</p></div><form id="query-form"><label>查询方式<select id="lookup-mode"><option value="mobile">手机号</option><option value="id">用户 ID</option></select></label><label><span id="lookup-label">手机号</span><input id="user-id" inputmode="numeric" autocomplete="off" placeholder="输入手机号" required maxlength="11" pattern="1[3-9][0-9]{9}"></label><button class="query-button" type="submit">查询记录</button><label class="check"><input id="include-deleted" type="checkbox">包含已删除会话</label></form><p id="query-status" role="status"></p></section>
<div class="workspace"><aside class="panel sessions-panel"><div class="panel-title"><h2>历史会话</h2><span id="session-count">—</span></div><div id="sessions" class="sessions"><p class="empty-state">输入手机号或用户 ID，查找聊过的日常。</p></div><nav class="pagination" aria-label="会话分页"><button id="previous" disabled>上一页</button><span id="page-number">—</span><button id="next" disabled>下一页</button></nav></aside>
<section class="panel conversation-panel"><div class="panel-title"><div><h2>消息记录</h2><p id="conversation-meta">选择左侧会话查看</p></div><button id="refresh" disabled>刷新</button></div><div id="yijian-agent-root"><div id="messages" class="messages" aria-live="polite"><div class="empty-state"><span class="empty-symbol">✧</span><h3>每段对话，都有迹可循</h3><p>这里展示消息原文与只读卡片。</p></div></div></div></section>
<aside class="panel inspector-panel"><div class="panel-title"><h2>排查详情</h2><span class="small-tag">结构与请求</span></div><div id="inspector"><p class="empty-state">选择会话后，查看请求状态、错误信息与原始记录。</p></div></aside></div></main>
<script src="/static/product-preview.js" defer></script><script src="/static/outfit-board.js" defer></script><script type="module" src="/static/ops/console.js"></script></body></html>
