# Initial certificate issuance only. Replace with the HTTPS config after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name aicloset-assistant.wxbjq.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS certificate setup in progress.\n";
    }
}
