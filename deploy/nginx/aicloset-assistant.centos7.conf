# Target: /usr/local/nginx/conf/vhost/aicloset-assistant.wxbjq.top.conf
# Run /usr/local/nginx/sbin/nginx -t before reload. Start the application on 127.0.0.1:8466 first.
server {
    listen 80;
    server_name aicloset-assistant.wxbjq.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://aicloset-assistant.wxbjq.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aicloset-assistant.wxbjq.top;

    ssl_certificate /usr/local/nginx/conf/keys/wxbjq.top/1wxbjq.top.pem;
    ssl_certificate_key /usr/local/nginx/conf/keys/wxbjq.top/1wxbjq.top.key;
    ssl_protocols TLSv1.2; # Compatible with the current server; enable TLSv1.3 after nginx -V verification.
    ssl_session_cache shared:StylistTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;

    # Drain is a local container operation, never an internet endpoint.
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8466;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # POST SSE: deliver progress immediately, and never replay a failed request.
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
