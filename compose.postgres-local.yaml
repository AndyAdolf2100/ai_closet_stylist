name: stylist-postgres-local
services:
  postgres:
    image: ${STYLIST_POSTGRES_IMAGE:?set in config/postgres-local.env}
    pull_policy: never
    environment:
      POSTGRES_DB: aicloset_stylist
      POSTGRES_USER: stylist
      POSTGRES_PASSWORD: ${STYLIST_POSTGRES_PASSWORD:?set in config/postgres-local.env}
    ports:
      - "127.0.0.1:${STYLIST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - stylist-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  stylist-postgres:
