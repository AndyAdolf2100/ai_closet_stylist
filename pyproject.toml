[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-closet-stylist"
version = "0.1.0"
description = "A focused, evidence-based stylist for the existing AI Closet APIs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "mcp>=1.13,<2",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "cryptography>=44,<51",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.9,<1"]

[tool.setuptools.package-data]
stylist = ["prompts/*.md", "static/*", "static/assets/*", "schema.sql"]

[tool.setuptools.packages.find]
include = ["stylist*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
