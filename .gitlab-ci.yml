variables:
  DEPLOY_ENV: "test" # test or dev; override when running a pipeline manually
  DEPLOY_HOST: "172.16.0.91"
  DEPLOY_ROOT: "/opt/aicloset-agent"

workflow:
  rules:
    - if: '$DEPLOY_ENV == "test" && ($CI_COMMIT_BRANCH == "test" || $CI_PIPELINE_SOURCE == "web")'
      variables:
        DEPLOY_PUBLIC_URL: "https://aicloset-agent.wxbjq.top"
    - if: '$DEPLOY_ENV == "dev" && ($CI_COMMIT_BRANCH == "test" || $CI_PIPELINE_SOURCE == "web")'
      variables:
        DEPLOY_PUBLIC_URL: "https://aicloset-assistant.wxbjq.top"
    - when: never

stages: [build, deploy]
default:
  tags: [devops-test]

job_build:
  stage: build
  script:
    - bash scripts/ci_package.sh "$DEPLOY_ENV" "$CI_PIPELINE_ID" "$CI_COMMIT_SHA"
    - scp "var/ci-release/aicloset-agent-${DEPLOY_ENV}-${CI_PIPELINE_ID}-${CI_COMMIT_SHA}.tar.gz" "var/ci-release/aicloset-agent-${DEPLOY_ENV}-${CI_PIPELINE_ID}-${CI_COMMIT_SHA}.tar.gz.sha256" "root@${DEPLOY_HOST}:/tmp/"

job_deploy:
  stage: deploy
  resource_group: aicloset-agent-shared-database
  environment:
    name: $DEPLOY_ENV
    url: $DEPLOY_PUBLIC_URL
  script:
    - |
      set -eu
      case "$DEPLOY_ENV" in test|dev) ;; *) exit 1 ;; esac
      archive="/tmp/aicloset-agent-${DEPLOY_ENV}-${CI_PIPELINE_ID}-${CI_COMMIT_SHA}.tar.gz"
      ssh "root@${DEPLOY_HOST}" "bash -s -- '$DEPLOY_ENV' '$archive' '$CI_COMMIT_SHA' '$DEPLOY_ROOT'" < deploy/ci/deploy.sh
